  <body style="background-image: url(/img/background2.jpg)">
    <div class="container">
      <div class="container-forms">
        <div class="container-info">
          <div class="info-item">
            <p>Bạn đã có tài khoản?</p>
            <button class="btn" onclick="toggleForm(true)">Đăng nhập</button>
          </div>
          <div class="info-item">
            <p>Bạn chưa có tài khoản?</p>
            <button class="btn" onclick="toggleForm(false)">Đăng ký</button>
          </div>
        </div>

        <div class="container-form">
          <form class="form-item log-in" action="" id="loginForm">
            <h1>Đăng nhập</h1>

            <!-- Select vai trò -->
            <!-- <div class="form-group">
              <select id="loginRole" name="role" class="form-select">
                <option value="chutro">Chủ trọ</option>
                <option value="nguoithue">Người thuê trọ</option>
              </select>
            </div> -->
            <input
              id="loginUsername"
              name="Username"
              placeholder="Tên đăng nhập"
              type="text"
            />

            <input
              id="loginPassword"
              name="Password"
              placeholder="Mật khẩu"
              type="password"
            />
            <div id="loginMessage"></div>
            <button class="btn" type="submit" onclick="login(event)">
              Đăng nhập
            </button>
          </form>

          <form class="form-item sign-up" action="" id="registerForm">
            <h1>Đăng ký</h1>
            <!-- Select vai trò -->
            <div class="form-group">
              <select id="loginRole" name="role" class="form-select">
                <option value="chutro">Chủ trọ</option>
                <option value="nguoithue">Người thuê trọ</option>
              </select>
            </div>

            <input
              type="email"
              id="regEmail"
              placeholder="Email"
              name="Email"
            />
            <input
              type="text"
              id="regPhone"
              placeholder="Số điện thoại"
              name="Phone"
            />
            <input
              type="text"
              id="regFullname"
              name="fullname"
              placeholder="Họ và tên"
            />
            <input
              type="text"
              id="regUsername"
              name="Username"
              placeholder="Tên đăng nhập"
            />
            <input
              type="password"
              id="regPassword"
              name="Password"
              placeholder="Mật khẩu"
            />
            <div id="regMessage"></div>
            <button class="btn" type="submit" onclick="register(event)">
              Đăng ký
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="/main.js"></script>
    <script>
      // 📌 Kiểm tra quyền truy cập nếu bạn đặt đoạn này trong admin_dashboard.html
      // const user = JSON.parse(localStorage.getItem("user"));
      // if (!user || user.role !== "admin") {
      //   alert("Bạn không có quyền truy cập!");
      //   window.location.href = "login_sign.html";
      // }
      // function toggleForm(isLogin) {
      //   document.querySelector(".log-in").style.display = isLogin
      //     ? "block"
      //     : "none";
      //   document.querySelector(".sign-up").style.display = isLogin
      //     ? "none"
      //     : "block";
      // }
      function register(event) {
        event.preventDefault();
        const user = {
          Email: document.getElementById("regEmail").value,
          Phone: document.getElementById("regPhone").value,
          fullname: document.getElementById("regFullname").value,
          Username: document.getElementById("regUsername").value,
          Password: document.getElementById("regPassword").value,
          role: document.getElementById("loginRole").value,
        };

        fetch("http://localhost/nhatro-backend/register.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("regMessage").textContent = data.message;
          })
          .catch(() => {
            document.getElementById("regMessage").textContent = "Lỗi đăng ký";
          });
      }

      function login(event) {
        event.preventDefault();
        const user = {
          Username: document.getElementById("loginUsername").value,
          Password: document.getElementById("loginPassword").value,
        };

        fetch("http://localhost/nhatro-backend/login.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        })
          .then((res) => {
            if (!res.ok) throw new Error();
            return res.json();
          })
          .then((data) => {
            document.getElementById("loginMessage").textContent = data.message;

            // ✅ Lưu thông tin user vào localStorage
            localStorage.setItem("user", JSON.stringify(data.user));

            // ✅ Chuyển hướng theo vai trò
            if (data.user.role === "admin") {
              window.location.href = "admin_dashboard.html";
            } else {
              window.location.href = "logn_in.html"; // hoặc user_home.html
            }
          })
          .catch(() => {
            document.getElementById("loginMessage").textContent =
              "Sai tài khoản hoặc mật khẩu";
          });
      }
    </script>
